<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="/Pydah_LOGO.png" />
    <link rel="apple-touch-icon" href="/Pydah_LOGO.png" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <meta name="theme-color" content="#0f172a" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <title>Campo - Stationery Management System</title>
    <!-- Centralized Theme Runtime Loader -->
    <script>
      (function() {
        var isLocal = window.location.hostname === 'localhost' || window.location.hostname === '127.0.0.1';
        var server = isLocal ? 'http://localhost:7000' : 'https://ui-theme.pydah.edu.in';
        var s = document.createElement('script');
        s.src = server + '/themes/theme-loader.js';
        s.setAttribute('data-theme-server', server);
        s.setAttribute('data-poll-interval', isLocal ? '5' : '30');
        document.head.appendChild(s);
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
